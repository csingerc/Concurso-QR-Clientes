<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>South Wind · Quiz de Inocuidad</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Barlow:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<style>
:root {
  --bg: #080f1e; --surface: #0f1d35; --surface2: #162845;
  --accent: #00c896; --accent2: #00a8ff; --text: #f0f4ff;
  --text-muted: #6b85b0; --border: #1a3258; --radius: 16px;
}
* { box-sizing:border-box; margin:0; padding:0; }
body {
  font-family:'Barlow',sans-serif; background:var(--bg);
  color:var(--text); min-height:100vh;
  display:flex; flex-direction:column; align-items:center;
  padding:32px 16px 60px;
}
body::before {
  content:''; position:fixed; inset:0;
  background:
    radial-gradient(ellipse 80% 50% at 50% -10%, rgba(0,200,150,0.1) 0%, transparent 60%),
    radial-gradient(ellipse 60% 40% at 80% 90%, rgba(0,168,255,0.07) 0%, transparent 60%);
  pointer-events:none;
}
.container { position:relative; z-index:1; width:100%; max-width:440px; }

/* Logo */
.logo {
  text-align:center; margin-bottom:36px;
}
.logo-sw {
  font-family:'Bebas Neue',sans-serif; font-size:14px;
  letter-spacing:0.2em; color:var(--text-muted);
  text-transform:uppercase; margin-bottom:10px;
}
.logo h1 {
  font-family:'Bebas Neue',sans-serif;
  font-size:clamp(38px,10vw,52px);
  line-height:0.95; letter-spacing:0.01em;
}
.logo h1 span {
  background:linear-gradient(90deg,var(--accent),var(--accent2));
  -webkit-background-clip:text; -webkit-text-fill-color:transparent;
  background-clip:text;
}
.logo p {
  color:var(--text-muted); font-size:14px;
  margin-top:10px; line-height:1.5;
}

/* Card */
.card {
  background:var(--surface); border:1px solid var(--border);
  border-radius:20px; padding:28px 24px; margin-bottom:16px;
}
.card-label {
  font-size:11px; font-weight:700; letter-spacing:0.12em;
  text-transform:uppercase; color:var(--text-muted); margin-bottom:20px;
}

/* Inputs */
.input-group { margin-bottom:16px; }
.input-group label {
  display:block; font-size:13px; font-weight:600;
  color:var(--text-muted); margin-bottom:6px;
}
.input-group input {
  width:100%; background:var(--surface2);
  border:1.5px solid var(--border); border-radius:10px;
  color:var(--text); font-family:'Barlow',sans-serif;
  font-size:16px; font-weight:500; padding:13px 15px;
  outline:none; transition:border-color 0.2s;
  -webkit-appearance:none;
}
.input-group input::placeholder { color:var(--text-muted); font-weight:400; }
.input-group input:focus { border-color:var(--accent); }
.input-hint { font-size:12px; color:var(--text-muted); margin-top:5px; line-height:1.4; }

/* Botón */
.btn-primary {
  width:100%; background:linear-gradient(135deg,var(--accent),#00a878);
  border:none; border-radius:12px; color:#071520;
  font-family:'Bebas Neue',sans-serif; font-size:18px;
  letter-spacing:0.05em; padding:15px; cursor:pointer;
  transition:opacity 0.2s, transform 0.1s;
  -webkit-tap-highlight-color:transparent;
}
.btn-primary:active { transform:scale(0.98); opacity:0.9; }
.btn-primary:disabled { opacity:0.4; cursor:not-allowed; }

/* Error */
.error-msg {
  display:none; background:rgba(255,70,70,0.1);
  border:1px solid rgba(255,70,70,0.3); border-radius:10px;
  color:#ff7070; font-size:13px; padding:11px 14px;
  margin-top:12px; text-align:center;
}

/* Demo */
.demo-link {
  text-align:center; margin-top:12px;
}
.demo-link button {
  background:none; border:none; color:var(--text-muted);
  font-family:'Barlow',sans-serif; font-size:13px;
  cursor:pointer; text-decoration:underline; padding:4px;
}

/* Ya logueado */
.already-in .name-pill {
  background:var(--surface2); border:1.5px solid var(--accent);
  border-radius:10px; padding:14px 16px; text-align:center;
  margin-bottom:16px;
}
.already-in .name-label { font-size:11px; color:var(--text-muted); margin-bottom:4px; letter-spacing:0.08em; text-transform:uppercase; }
.already-in .name-val { font-family:'Bebas Neue',sans-serif; font-size:24px; color:var(--accent); }

.btn-secondary {
  width:100%; background:none; border:1.5px solid var(--border);
  border-radius:12px; color:var(--text-muted);
  font-family:'Barlow',sans-serif; font-size:14px; font-weight:600;
  padding:13px; cursor:pointer; margin-top:10px;
  -webkit-tap-highlight-color:transparent;
}

/* Footer */
.footer { text-align:center; color:var(--text-muted); font-size:11px; margin-top:24px; line-height:1.6; }

.fade-in { animation:fadeIn 0.4s ease forwards; }
@keyframes fadeIn { from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="container fade-in">

  <!-- Logo -->
  <div class="logo">
    <div class="logo-sw">South Wind</div>
    <h1>Quiz de<br><span>Inocuidad</span></h1>
    <p>5 días · 3 niveles · ¿Cuánto sabes sobre el salmón que comes?</p>
  </div>

  <!-- Card login -->
  <div class="card" id="loginCard">
    <div class="card-label">Crea tu perfil para jugar</div>

    <div id="loginForm">
      <div class="input-group">
        <label for="inputNombre">Tu nombre</label>
        <input type="text" id="inputNombre" placeholder="Como quieres aparecer en el ranking" maxlength="40" autocomplete="name"/>
      </div>
      <div class="input-group">
        <label for="inputEmail">Tu email</label>
        <input type="email" id="inputEmail" placeholder="para guardar tu progreso entre días" autocomplete="email"/>
        <div class="input-hint">Tu email solo se usa para guardar tu avance. No recibirás publicidad.</div>
      </div>
      <button class="btn-primary" onclick="entrar()">Comenzar →</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="demo-link">
      <button onclick="entrarDemo()">Entrar en modo demo (sin guardar progreso)</button>
    </div>
  </div>

  <div class="footer">
    South Wind · Calidad &amp; Inocuidad<br>
    7 de junio — Día Mundial de la Inocuidad Alimentaria 🌍
  </div>

</div>

<script src="js/config.js"></script>
<script>
let sbClient;

function initSupabase() {
  if (window.supabase && window.supabase.createClient) {
    sbClient = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
  }
}

function getUsuario() {
  try { return JSON.parse(sessionStorage.getItem('sw2_usuario')); } catch { return null; }
}
function setUsuario(u) { sessionStorage.setItem('sw2_usuario', JSON.stringify(u)); }

function mostrarError(msg) {
  const el = document.getElementById('errorMsg');
  el.textContent = msg; el.style.display = 'block';
}
function ocultarError() { document.getElementById('errorMsg').style.display = 'none'; }

function validarEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
}

async function entrar() {
  ocultarError();
  const nombre = document.getElementById('inputNombre').value.trim();
  const email = document.getElementById('inputEmail').value.trim().toLowerCase();

  if (!nombre) { mostrarError('Ingresa tu nombre para aparecer en el ranking.'); return; }
  if (!validarEmail(email)) { mostrarError('Ingresa un email válido para guardar tu progreso.'); return; }

  const btn = document.querySelector('.btn-primary');
  btn.textContent = '...'; btn.disabled = true;

  try {
    const { error } = await sbClient
      .from('qrhunt2_participantes')
      .upsert({ email, nombre, updated_at: new Date().toISOString() }, { onConflict: 'email' });

    if (error) throw error;

    setUsuario({ email, nombre });
    window.location.href = 'home.html';

  } catch (err) {
    console.error(err);
    mostrarError('Error al conectar. Intenta de nuevo.');
    btn.textContent = 'Comenzar →'; btn.disabled = false;
  }
}

function entrarDemo() {
  setUsuario({ email: CONFIG.emailDemo, nombre: 'Demo' });
  window.location.href = 'home.html';
}

document.addEventListener('DOMContentLoaded', () => {
  initSupabase();

  // Si ya tiene sesión, ir directo
  const u = getUsuario();
  if (u) {
    const card = document.getElementById('loginCard');
    card.innerHTML = `
      <div class="card-label">Ya tienes sesión activa</div>
      <div class="already-in">
        <div class="name-pill">
          <div class="name-label">Jugando como</div>
          <div class="name-val">${u.nombre}</div>
        </div>
        <button class="btn-primary" onclick="window.location.href='home.html'">Continuar →</button>
        <button class="btn-secondary" onclick="sessionStorage.removeItem('sw2_usuario'); location.reload()">Cambiar usuario</button>
      </div>
    `;
  }

  ['inputNombre','inputEmail'].forEach(id => {
    document.getElementById(id)?.addEventListener('keydown', e => {
      if (e.key === 'Enter') entrar();
    });
  });
});
</script>
</body>
</html>
