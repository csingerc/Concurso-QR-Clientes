<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>La Ruta del Salmón · South Wind</title>
<meta name="description" content="5 días, 3 niveles, todo sobre el salmón que comes. Un quiz de inocuidad de South Wind."/>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/design.css"/>
<style>
.login-card-wrap { margin-bottom:0; }
.demo-link { text-align:center; margin-top:14px; }
.already-name {
  background:rgba(200,168,75,0.08); border:1.5px solid var(--gold-border);
  border-radius:var(--radius); padding:16px; text-align:center; margin-bottom:16px;
}
.already-name .an-label { font-size:10px; font-weight:800; letter-spacing:0.12em; text-transform:uppercase; color:var(--gold-500); margin-bottom:5px; }
.already-name .an-val { font-family:'Playfair Display',serif; font-size:22px; font-style:italic; }
</style>
</head>
<body>
<div class="container">

  <!-- Brand -->
  <div class="brand-header fade-in">
    <div class="brand-eyebrow">South Wind</div>
    <span class="brand-compass">🧭</span>
    <h1 class="brand-title">La Ruta<br><em>del Salmón</em></h1>
    <p class="brand-subtitle">5 días · 3 niveles · ¿Cuánto sabes sobre el salmón que comes?</p>
  </div>

  <div class="gold-rule fade-in-1"><span class="gold-rule-icon">✦</span></div>

  <!-- Card login -->
  <div class="card card-gold fade-in-2" id="loginCard">
    <div class="card-label">Crea tu perfil para jugar</div>

    <div id="loginForm">
      <div class="input-group">
        <label for="inputNombre">Tu nombre</label>
        <input type="text" id="inputNombre" placeholder="Como quieres aparecer en el ranking" maxlength="40" autocomplete="name"/>
      </div>
      <div class="input-group">
        <label for="inputEmail">Tu email</label>
        <input type="email" id="inputEmail" placeholder="para guardar tu progreso entre días" autocomplete="email"/>
        <div class="input-hint">Solo usamos tu email para guardar tu avance. No recibirás publicidad.</div>
      </div>
      <button class="btn-primary" onclick="entrar()">Comenzar la ruta →</button>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <div class="demo-link">
      <button class="btn-ghost" onclick="entrarDemo()">Explorar sin guardar progreso</button>
    </div>
  </div>

  <!-- Footer -->
  <footer class="site-footer fade-in-3">
    <div class="footer-compass">🧭</div>
    <div class="footer-brand">South Wind</div>
    <div class="footer-links">
      <a href="https://www.southwind.cl" target="_blank" rel="noopener">🌐 southwind.cl</a>
      <span class="footer-sep">·</span>
      <a href="https://www.instagram.com/southwindoficial/" target="_blank" rel="noopener">📸 @southwindoficial</a>
    </div>
    <div class="footer-copy">7 de junio · Día Mundial de la Inocuidad Alimentaria 🌍</div>
  </footer>

</div>

<script src="js/config.js"></script>
<script>
let sbClient;
function initSupabase() {
  if (window.supabase?.createClient)
    sbClient = window.supabase.createClient(CONFIG.supabase.url, CONFIG.supabase.anonKey);
}
function getUsuario() { try { return JSON.parse(sessionStorage.getItem('sw2_usuario')); } catch { return null; } }
function setUsuario(u) { sessionStorage.setItem('sw2_usuario', JSON.stringify(u)); }
function mostrarError(msg) { const el=document.getElementById('errorMsg'); el.textContent=msg; el.style.display='block'; }
function ocultarError() { document.getElementById('errorMsg').style.display='none'; }
function validarEmail(e) { return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(e); }

async function entrar() {
  ocultarError();
  const nombre = document.getElementById('inputNombre').value.trim();
  const email = document.getElementById('inputEmail').value.trim().toLowerCase();
  if (!nombre) { mostrarError('Ingresa tu nombre para aparecer en el ranking.'); return; }
  if (!validarEmail(email)) { mostrarError('Ingresa un email válido para guardar tu progreso.'); return; }
  const btn = document.querySelector('.btn-primary');
  btn.textContent = '...'; btn.disabled = true;
  try {
    const { error } = await sbClient.from('qrhunt2_participantes')
      .upsert({ email, nombre, updated_at: new Date().toISOString() }, { onConflict: 'email' });
    if (error) throw error;
    setUsuario({ email, nombre });
    window.location.href = 'home.html';
  } catch(err) {
    mostrarError('Error al conectar. Intenta de nuevo.');
    btn.textContent = 'Comenzar la ruta →'; btn.disabled = false;
  }
}

function entrarDemo() {
  setUsuario({ email: CONFIG.emailDemo, nombre: 'Explorador' });
  window.location.href = 'home.html';
}

document.addEventListener('DOMContentLoaded', () => {
  initSupabase();
  const u = getUsuario();
  if (u) {
    document.getElementById('loginCard').innerHTML = `
      <div class="card-label">Ya tienes sesión activa</div>
      <div class="already-name">
        <div class="an-label">Jugando como</div>
        <div class="an-val">${u.nombre}</div>
      </div>
      <button class="btn-primary" onclick="window.location.href='home.html'">Continuar la ruta →</button>
      <button class="btn-secondary" onclick="sessionStorage.removeItem('sw2_usuario');location.reload()">Cambiar usuario</button>`;
  }
  ['inputNombre','inputEmail'].forEach(id =>
    document.getElementById(id)?.addEventListener('keydown', e => { if(e.key==='Enter') entrar(); })
  );
});
</script>
</body>
</html>
