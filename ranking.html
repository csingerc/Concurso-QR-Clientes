<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0"/>
<title>Ranking · La Ruta del Salmón</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<link rel="stylesheet" href="css/design.css"/>
<style>
.page-header{text-align:center;padding:8px 0 18px;}
.page-header h1{font-family:'Playfair Display',serif;font-size:clamp(28px,7vw,40px);font-weight:700;font-style:italic;margin-top:6px;}
.page-meta{font-size:13px;color:var(--cream-dim);margin-top:5px;}
.tabs{display:flex;gap:7px;margin-bottom:18px;}
.tab-btn{flex:1;border-radius:10px;padding:10px 4px;font-family:'Barlow',sans-serif;font-size:11px;font-weight:800;letter-spacing:0.06em;text-transform:uppercase;cursor:pointer;border:1.5px solid;transition:all 0.2s;-webkit-tap-highlight-color:transparent;}
.tab-btn.facil  {border-color:rgba(0,180,100,0.15);color:rgba(61,214,140,0.45);background:transparent;}
.tab-btn.medio  {border-color:rgba(200,168,75,0.15);color:rgba(200,168,75,0.45);background:transparent;}
.tab-btn.experto{border-color:rgba(130,80,240,0.15);color:rgba(167,139,250,0.45);background:transparent;}
.tab-btn.active.facil  {border-color:rgba(0,180,100,0.4);color:#3dd68c;background:rgba(0,180,100,0.07);}
.tab-btn.active.medio  {border-color:var(--gold-line);color:var(--gold);background:var(--gold-dim);}
.tab-btn.active.experto{border-color:rgba(130,80,240,0.35);color:#a78bfa;background:rgba(130,80,240,0.07);}
.podio{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:8px;align-items:end;margin-bottom:16px;}
.pi{border-radius:var(--radius);padding:14px 8px 12px;text-align:center;background:var(--surface);}
.pi.p1{border:1px solid var(--gold-line);background:var(--surface2);padding-top:20px;}
.pi.p2{border:1px solid var(--border-md);}
.pi.p3{border:1px solid var(--border);}
.pi-crown{font-size:18px;margin-bottom:4px;}
.pi-name{font-family:'Playfair Display',serif;font-size:13px;font-weight:700;line-height:1.2;margin-bottom:4px;word-break:break-word;}
.p1 .pi-name{color:var(--gold);font-size:15px;}
.p2 .pi-name{color:rgba(240,236,228,0.7);}
.p3 .pi-name{color:rgba(240,236,228,0.5);}
.pi-pts{font-family:'Playfair Display',serif;font-size:16px;font-weight:700;}
.p1 .pi-pts{font-size:20px;color:var(--gold);}
.p2 .pi-pts{color:rgba(240,236,228,0.6);}
.p3 .pi-pts{color:rgba(240,236,228,0.4);}
.pi-dias{font-size:10px;color:var(--cream-dim);margin-top:2px;}
.rlist{display:flex;flex-direction:column;gap:6px;}
.ri{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;display:flex;align-items:center;gap:11px;}
.ri.yo{border-color:var(--gold-line);background:var(--surface2);}
.ri-pos{font-family:'Playfair Display',serif;font-size:14px;font-weight:700;color:var(--cream-dim);width:24px;text-align:center;flex-shrink:0;}
.ri-av{width:32px;height:32px;border-radius:50%;background:var(--gold-dim);border:1px solid var(--gold-line);display:flex;align-items:center;justify-content:center;font-family:'Playfair Display',serif;font-size:12px;color:var(--gold);font-weight:700;flex-shrink:0;}
.ri-info{flex:1;min-width:0;}
.ri-name{font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ri-detail{font-size:11px;color:var(--cream-dim);margin-top:1px;}
.ri-score{text-align:right;flex-shrink:0;}
.ri-pts{font-family:'Playfair Display',serif;font-size:17px;font-weight:700;color:var(--gold);}
.ri-ptsl{font-size:10px;color:var(--cream-dim);}
.empty{text-align:center;padding:32px 0;color:var(--cream-dim);font-size:14px;}
.refresh-note{text-align:center;font-size:11px;color:rgba(154,164,184,0.35);margin-top:12px;}
.btn-back-p{display:block;margin:14px auto 0;background:none;border:1px solid var(--border-md);border-radius:var(--radius);color:var(--cream-dim);font-family:'Barlow',sans-serif;font-size:13px;padding:9px 20px;cursor:pointer;}
</style>
</head>
<body>
<div class="container container-wide">
  <div class="page-header fade-in">
    <div class="live-pill"><span class="live-dot"></span> En vivo</div>
    <h1>Ranking</h1>
    <div class="page-meta" id="pageMeta">Cargando...</div>
  </div>
  <div class="tabs fade-in-1">
    <button class="tab-btn facil active" onclick="setTab('facil')">🌱 Fácil</button>
    <button class="tab-btn medio" onclick="setTab('medio')">🔥 Medio</button>
    <button class="tab-btn experto" onclick="setTab('experto')">🧬 Experto</button>
  </div>
  <div class="podio fade-in-2" id="podio"></div>
  <div class="rlist fade-in-3" id="rlist"><div class="empty"><div class="spinner"></div></div></div>
  <div class="refresh-note" id="refreshNote"></div>
  <button class="btn-back-p" onclick="window.location.href='home.html'">← Volver al inicio</button>
  <footer class="site-footer">
    
    <div class="footer-brand">South Wind</div>
    <div class="footer-links">
      <a href="https://www.southwind.cl" target="_blank" rel="noopener">🌐 southwind.cl</a>
      <span class="footer-sep">·</span>
      <a href="https://www.instagram.com/southwindoficial/" target="_blank" rel="noopener">📸 @southwindoficial</a>
    </div>
  </footer>
</div>
<script src="js/config.js"></script>
<script>
let sbClient,tab='facil',emailYo=null;
function initSb(){if(window.supabase?.createClient)sbClient=window.supabase.createClient(CONFIG.supabase.url,CONFIG.supabase.anonKey);}
function setTab(n){tab=n;document.querySelectorAll('.tab-btn').forEach(b=>b.classList.toggle('active',b.classList.contains(n)));cargar();}
function inic(n){return n.split(' ').slice(0,2).map(p=>p[0]?.toUpperCase()||'').join('');}
async function cargar(){
  if(!sbClient)return;
  try{
    const{data,error}=await sbClient.from('qrhunt2_progreso').select('email,puntaje,dia,qrhunt2_participantes(nombre)').eq('nivel',tab);
    if(error)throw error;
    const map={};
    (data||[]).forEach(r=>{const nom=r.qrhunt2_participantes?.nombre||'Anónimo';if(!map[r.email])map[r.email]={nombre:nom,email:r.email,puntaje:0,dias:0};map[r.email].puntaje+=r.puntaje;map[r.email].dias++;});
    const lista=Object.values(map).sort((a,b)=>b.puntaje-a.puntaje);
    document.getElementById('pageMeta').textContent=lista.length+' participantes · Nivel '+tab;
    document.getElementById('refreshNote').textContent='Actualizado: '+new Date().toLocaleTimeString('es-CL',{hour:'2-digit',minute:'2-digit',second:'2-digit'})+' · refresca cada 15s';
    renderPodio(lista.slice(0,3));renderLista(lista.slice(3));
  }catch(e){console.error(e);}
}
function renderPodio(t){
  const el=document.getElementById('podio');if(!t.length){el.innerHTML='';return;}
  const ord=[t[1]||null,t[0]||null,t[2]||null],cl=['p2','p1','p3'],cr=['🥈','🥇','🥉'];
  el.innerHTML=ord.map((it,vi)=>{
    if(!it)return'<div class="pi '+cl[vi]+'"></div>';
    const yo=it.email===emailYo;
    return'<div class="pi '+cl[vi]+'"><div class="pi-crown">'+cr[vi]+'</div><div class="pi-name">'+it.nombre+(yo?' 👈':'')+'</div><div class="pi-pts">'+it.puntaje+'</div><div class="pi-dias">'+it.dias+' día'+(it.dias!==1?'s':'')+'</div></div>';
  }).join('');
}
function renderLista(items){
  const el=document.getElementById('rlist');if(!items.length){el.innerHTML='';return;}
  el.innerHTML=items.map((it,i)=>{
    const yo=it.email===emailYo;
    return'<div class="ri'+(yo?' yo':'')+'"><div class="ri-pos">'+(i+4)+'°</div><div class="ri-av">'+inic(it.nombre)+'</div><div class="ri-info"><div class="ri-name">'+it.nombre+(yo?' 👈':'')+'</div><div class="ri-detail">'+it.dias+' día'+(it.dias!==1?'s':'')+'</div></div><div class="ri-score"><div class="ri-pts">'+it.puntaje+'</div><div class="ri-ptsl">pts</div></div></div>';
  }).join('');
}
document.addEventListener('DOMContentLoaded',()=>{
  initSb();
  try{emailYo=JSON.parse(sessionStorage.getItem('sw2_usuario'))?.email||null;}catch{}
  cargar();setInterval(cargar,CONFIG.rankingRefreshMs);
});
</script>
</body>
</html>
